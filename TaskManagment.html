<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
  <link rel="stylesheet" href="TaskManagment.css">
</head>
<body>

  <div class="container">

    <!-- sidebar -->
    <div class="sidebar">
      <h2 class="logo">TaskApp</h2>

      <ul class="menu">
        <li><a href="#">Dashboard</a></li>
        <li><a href="#" class="active">Tasks</a></li>
      </ul>

      <a href="#" class="logout">Logout</a>
    </div>

    <!-- main content -->
    <div class="main">

      <div class="top-bar">
        <div>
          <h1>My Tasks</h1>
          <p id="task-count">You have 0 tasks</p>
        </div>
        <button class="add-btn" id="add-task-btn">+ Add Task</button>
      </div>

      <div class="task-list" id="task-list">
        <!-- task cards are created by script.js from the tasks array -->
      </div>

      <p class="empty" id="empty-message" hidden>No tasks yet. Click "+ Add Task" to create one.</p>

    </div>

  </div>

  <!-- add task modal -->
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

      <h2 id="modal-title">Add New Task</h2>

      <form id="task-form" novalidate>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Enter task title">
        <p class="error" id="title-error"></p>

        <label for="description">Description</label>
        <textarea id="description" rows="4" placeholder="Enter task description"></textarea>

        <div class="modal-buttons">
          <button type="button" class="cancel-btn" id="cancel-btn">Cancel</button>
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>

    </div>
  </div>

  <script src="TaskManagment.js"></script>
</body>
</html>

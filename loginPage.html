<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
  <main class="auth-card">

    <!-- Navigation: real links with hash URLs, so Back/Forward and bookmarks work -->
    <nav class="auth-nav" aria-label="Account">
      <a href="#login" data-nav="login">Log in</a>
    
    </nav>

    <!--  LOGIN VIEW  -->
    <section id="view-login" class="view" data-title="Log in" aria-labelledby="login-heading">
      <h1 id="login-heading" tabindex="-1">Welcome back</h1>
      <p class="subtitle">Log in to continue.</p>

      <form data-form="login" novalidate>
        <fieldset>
          <legend>Your account</legend>

           <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" required
                   autocomplete="email" aria-describedby="login-email-error" aria-invalid="false">
            <p id="login-email-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" required
                   autocomplete="current-password" aria-describedby="login-password-error" aria-invalid="false">
            <p id="login-password-error" class="error" aria-live="polite"></p>
          </div>
        </fieldset>

        <button type="submit" class="btn">Log in</button>
        <p class="success" role="status" hidden></p>
      </form>

      <p class="switch-page">New here? <a href="#register" data-nav="register">Create an account</a></p>
    </section>

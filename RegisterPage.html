<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="RegisterPage.css">
</head>
<body>
  <main class="auth-card">

    
    <nav class="auth-nav" aria-label="Account">
      <a href="#login" data-nav="login">register</a>


<mai></mai
    <section id="view-register" class="view" data-title="Create account" aria-labelledby="register-heading" hidden>
      <h1 id="register-heading" tabindex="-1">Create your account</h1>
      <p class="subtitle">It takes less than a minute.</p>

      <form data-form="register" novalidate>
        <fieldset>
          <legend>Your details</legend>

          <div class="field">
            <label for="reg-name">Full name</label>
            <input id="reg-name" name="name" type="text" required minlength="2"
                   autocomplete="name" aria-describedby="reg-name-error" aria-invalid="false">
            <p id="reg-name-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="reg-email">Email</label>
            <input id="reg-email" name="email" type="email" required
                   autocomplete="email" aria-describedby="reg-email-error" aria-invalid="false">
            <p id="reg-email-error" class="error" aria-live="polite"></p>
          </div>
        </fieldset>

        <fieldset>
          <legend>Set a password</legend>

          <div class="field">
            <label for="reg-password">Password</label>
            <small id="reg-password-hint" class="hint">At least 8 characters.</small>
            <input id="reg-password" name="password" type="password" required minlength="8"
                   autocomplete="new-password" aria-describedby="reg-password-hint reg-password-error" aria-invalid="false">
            <p id="reg-password-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="reg-confirm">Confirm password</label>
            <input id="reg-confirm" name="confirm" type="password" required
                   autocomplete="new-password" aria-describedby="reg-confirm-error" aria-invalid="false">
            <p id="reg-confirm-error" class="error" aria-live="polite"></p>
          </div>
        </fieldset>
        <button type="submit" class="btn">Create 
            Account</button>
        

        
      </form>
    </section>


</nav>
</main> 
</body>
</html>
